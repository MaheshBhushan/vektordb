[package]
name = "vektordb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.9"
crossbeam-epoch = "0.9"
parking_lot = "0.12"
rayon = "1.10"
crc32fast = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
