name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The AVX2 kernels are runtime-dispatched; this records whether the
      # runner actually exercised them or fell back to scalar. grep exits 1
      # when it matches nothing, which would fail the job on a runner without
      # AVX2 (or any non-x86 runner) -- so this must not gate the build.
      - name: Report CPU features
        run: |
          grep -o 'avx2\|fma' /proc/cpuinfo | sort -u \
            || echo 'no avx2/fma -- scalar fallback path'

      - name: Build
        run: cargo build --workspace --release

      # Unit, property (proptest), concurrency stress, and the crash-recovery
      # harness in vektordb-cli/tests/crash.rs, which SIGKILLs a live ingest at
      # randomized points and asserts every acked insert survives reopen.
      - name: Test
        run: cargo test --workspace --release
